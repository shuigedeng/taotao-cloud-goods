syntax = "proto3";

package com.taotao.cloud.goods.api.grpc;

option java_multiple_files = true;
option java_package = "com.taotao.cloud.goods.api.grpc.query";
option java_outer_classname = "CategoryQueryGrpcServiceProto";
//option objc_class_prefix = "HLW";

import "dto/query/GoodsQuery.proto";
import "dto/response/GoodsResponse.proto";

service CategoryQueryGrpcService {
  rpc queryCategory (CategoryGrpcQuery) returns (CategoryGrpcResponse){}
}



