syntax = "proto3";

package com.taotao.cloud.goods.api.grpc;

option java_multiple_files = true;
option java_package = "com.taotao.cloud.goods.api.grpc.dto.query";
option java_outer_classname = "GoodsQueryProto";
//option objc_class_prefix = "HLW";

message CategoryGrpcQuery {
  string id = 1;
}

message GoodsNumGrpcQuery {
  string id = 1;
}

message GoodsSkuGrpcQuery {
  string id = 1;
}
